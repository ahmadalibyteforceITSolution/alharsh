<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="elecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="mcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#elecBg)" />

  <!-- Circuit Grid Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M50,50 L250,50 L300,100 L600,100 L650,50 L750,50" />
    <path d="M100,200 L300,200 L350,250 L550,250 L600,300 L700,300" />
    <circle cx="250" cy="50" r="5" fill="#38bdf8" />
    <circle cx="600" cy="100" r="5" fill="#38bdf8" />
    <circle cx="350" cy="250" r="5" fill="#38bdf8" />
  </g>

  <!-- Copper Cable Coil & Breaker Graphic -->
  <g transform="translate(150, 100)">
    
    <!-- Copper Cable Reel -->
    <ellipse cx="160" cy="120" rx="140" ry="60" fill="none" stroke="url(#copperGrad)" stroke-width="28" filter="drop-shadow(0 12px 18px rgba(0,0,0,0.5))" />
    <ellipse cx="160" cy="100" rx="130" ry="55" fill="none" stroke="#dc2626" stroke-width="18" />
    <ellipse cx="160" cy="85" rx="115" ry="50" fill="none" stroke="#2563eb" stroke-width="16" />
    <ellipse cx="160" cy="70" rx="95" ry="40" fill="none" stroke="#eab308" stroke-width="14" />

    <!-- Pure Copper Strands -->
    <g transform="translate(260, 40)">
      <line x1="0" y1="0" x2="60" y2="-30" stroke="#f97316" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="10" x2="65" y2="-20" stroke="#f97316" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="20" x2="70" y2="-10" stroke="#f97316" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- Industrial Circuit Breaker MCB -->
    <g transform="translate(360, -20)" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))">
      <rect x="0" y="0" width="110" height="170" rx="10" fill="url(#mcbGrad)" stroke="#64748b" stroke-width="2" />
      <rect x="15" y="20" width="80" height="35" rx="4" fill="#0f172a" />
      <text x="25" y="42" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">32A 6kA</text>
      <!-- Switch Toggle Knob -->
      <rect x="35" y="70" width="40" height="50" rx="6" fill="#dc2626" />
      <rect x="42" y="75" width="26" height="20" rx="3" fill="#ffffff" opacity="0.3" />
      <!-- Indicator -->
      <circle cx="55" cy="140" r="8" fill="#10b981" />
    </g>

    <!-- Lightning Bolt Flash -->
    <path d="M300,-10 L270,40 L295,40 L265,95 L320,30 L295,30 Z" fill="#fbbf24" filter="drop-shadow(0 0 15px #f59e0b)" />
  </g>

  <text x="50" y="440" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900" letter-spacing="1">WIRES, CABLES &amp; SWITCHGEAR</text>
  <text x="50" y="470" fill="#fed7aa" font-family="sans-serif" font-size="14" font-weight="600">FAST CABLES &bull; SCHNEIDER MCBs &bull; PIANO GLASS SWITCHES &bull; BLDC FANS</text>
</svg>
