<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sanitaryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072847" />
      <stop offset="50%" stop-color="#074c82" />
      <stop offset="100%" stop-color="#026fc2" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#sanitaryBg)" />
  
  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
  </g>

  <!-- PPRC Pipe Stack Illustration -->
  <g transform="translate(100, 120)">
    <!-- Main Green PPRC Pipe -->
    <rect x="0" y="80" width="600" height="48" rx="8" fill="url(#pipeGrad)" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))" />
    <line x1="0" y1="104" x2="600" y2="104" stroke="#ef4444" stroke-width="4" stroke-dasharray="16,8" />
    <text x="30" y="110" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" opacity="0.9">POPULAR PPRC PN-20 32mm DIN 8077/8078 HOT &amp; COLD</text>

    <!-- Chrome Basin Mixer Tap Graphic -->
    <g transform="translate(420, -40)">
      <path d="M40,160 L40,60 C40,20 80,10 120,40 L130,50 C135,55 130,65 120,65 L100,65 C70,65 65,80 65,160 Z" fill="url(#chromeGrad)" filter="drop-shadow(0 8px 12px rgba(0,0,0,0.4))" />
      <rect x="25" y="160" width="60" height="15" rx="3" fill="url(#chromeGrad)" />
      <rect x="20" y="50" width="15" height="40" rx="4" fill="#38bdf8" transform="rotate(-30 20 50)" />
      <!-- Water Droplet -->
      <path d="M125,75 C125,75 135,90 135,100 C135,106 130,110 125,110 C120,110 115,106 115,100 C115,90 125,75 125,75 Z" fill="#38bdf8" opacity="0.8" />
    </g>

    <!-- Fitting Elbow -->
    <g transform="translate(80, 0)">
      <path d="M0,80 C0,30 40,0 90,0 L120,0 L120,35 L90,35 C65,35 40,55 40,80 Z" fill="url(#pipeGrad)" filter="drop-shadow(0 6px 10px rgba(0,0,0,0.3))" />
      <rect x="110" y="-5" width="20" height="45" rx="3" fill="#047857" />
    </g>
  </g>

  <!-- Text Overlay -->
  <text x="50" y="440" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900" letter-spacing="1">SANITARY &amp; PIPING SYSTEMS</text>
  <text x="50" y="470" fill="#7dd3fc" font-family="sans-serif" font-size="14" font-weight="600">PPRC PIPES &bull; BRASS TAPS &bull; COMMODES &bull; SHOWERS &bull; TANKS</text>
</svg>
